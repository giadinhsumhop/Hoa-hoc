<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoá học vui – Lớp 8 & 9</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8fbf3;--card:#fff;--ink:#1d1647;--mut:#5d5a7a;--acc:#6c4cf0;--sun:#ffc233;--pink:#ff5c8a;--line:#cfc8f5;--sh:#1d1647;--kl:#cfeaf8;--pk:#ffe2a8;--kh:#e5d4ff;--good:#16a05a;--bad:#e0244f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17122e;--card:#272050;--ink:#f4f0ff;--mut:#b2acd6;--acc:#9a84ff;--line:#4a4180;--sh:#000;--kl:#1f4a63;--pk:#6a5218;--kh:#47336f}}
:root[data-theme="dark"]{--bg:#17122e;--card:#272050;--ink:#f4f0ff;--mut:#b2acd6;--acc:#9a84ff;--line:#4a4180;--sh:#000;--kl:#1f4a63;--pk:#6a5218;--kh:#47336f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:'Baloo 2',Nunito,system-ui,sans-serif;line-height:1.15;margin:0}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:2.1rem;font-weight:800}header p{margin:2px 0 10px;color:var(--mut)}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
button{font-family:inherit;color:var(--ink);cursor:pointer}button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
nav button{flex:1;padding:10px 2px;border:3px solid var(--ink);background:var(--card);border-radius:14px;font-weight:700;box-shadow:3px 3px 0 var(--sh)}
nav button[aria-selected=true]{background:var(--acc);color:#fff;transform:translate(2px,2px);box-shadow:1px 1px 0 var(--sh)}
section{display:none;margin-top:10px}section.on{display:block}
.card{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px;margin-top:12px;box-shadow:4px 4px 0 var(--sh)}
.hint{color:var(--mut);font-size:.92rem;margin:4px 0 10px}
.tg{display:flex;gap:6px;margin-top:10px}.tg button{flex:1;padding:9px;border:3px solid var(--ink);border-radius:12px;background:var(--card);font-weight:800}
.tg button[aria-pressed=true]{background:var(--sun);color:#1d1647}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.el{border:3px solid transparent;border-radius:10px;padding:3px 0;text-align:center}
.el b{display:block;font:800 1.2rem 'Baloo 2',sans-serif;line-height:1.1}.el small{font-size:.62rem;color:var(--mut);display:block}
.el.k{background:var(--kl)}.el.p{background:var(--pk)}.el.h{background:var(--kh)}.el[aria-pressed=true]{border-color:var(--ink)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem;margin-top:8px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0}.info dt{color:var(--mut)}.info dd{margin:0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 12px;border-radius:999px;border:3px solid var(--ink);background:var(--card);font-weight:800}
.chip[aria-pressed=true]{background:var(--pink);color:#fff}
.act{margin-top:10px;padding:8px;border-radius:10px;background:var(--kl);font-size:.9rem;text-align:center}
.stage{display:flex;justify-content:center;align-items:flex-end;height:200px}
.beaker{width:140px;height:170px;border:4px solid var(--ink);border-top:none;border-radius:0 0 30px 30px;position:relative;overflow:hidden;background:rgba(150,200,230,.15)}
.beaker.sk{animation:sk .35s 4}@keyframes sk{25%{transform:translateX(-7px) rotate(-3deg)}75%{transform:translateX(7px) rotate(3deg)}}
.liquid{position:absolute;inset:auto 0 0 0;height:58%;background:#bfe6ef;transition:background 1s}
.ppt{position:absolute;inset:auto 0 0 0;height:0;transition:height 1.4s .3s}
.face{position:absolute;left:0;right:0;top:62px;text-align:center;font-size:2.6rem;z-index:2;transition:transform .2s}
.bub{position:absolute;bottom:0;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.9);animation:up 1.5s infinite ease-in}
@keyframes up{to{transform:translateY(-140px);opacity:0}}
.pt{position:fixed;bottom:34%;font-size:1.7rem;pointer-events:none;animation:pf 1.5s forwards;z-index:9}
@keyframes pf{to{transform:translateY(-170px) rotate(50deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.bub,.pt,.beaker.sk{animation:none}}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{padding:11px 18px;border:3px solid var(--ink);border-radius:12px;background:var(--acc);color:#fff;font-weight:800;box-shadow:3px 3px 0 var(--sh)}
.btn.alt{background:var(--card);color:var(--ink)}.btn:disabled{opacity:.45}
.eq{font:800 1.15rem 'Baloo 2',sans-serif;overflow-x:auto;white-space:nowrap;padding:4px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:800;font-size:.85rem;background:var(--sun);color:#1d1647}
.mol{display:flex;gap:8px;align-items:flex-start;margin-top:8px}.mol span{font-size:1.8rem}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:11px;border-radius:12px;border:3px solid var(--ink);background:var(--card);font-weight:700}
.opt.ok{background:color-mix(in srgb,var(--good) 30%,var(--card))}.opt.no{background:color-mix(in srgb,var(--bad) 30%,var(--card))}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pink);transition:width .3s}
.why{margin-top:10px;padding:10px;border-left:5px solid var(--sun);background:var(--bg);border-radius:6px}
input{width:100%;padding:10px;border:3px solid var(--ink);border-radius:10px;font:700 1rem Nunito,sans-serif;background:var(--card);color:var(--ink)}
details.card summary{font:800 1.15rem 'Baloo 2',sans-serif;cursor:pointer}details.card summary span{font-size:1.4rem}
details.card p{margin:8px 0}details.card ul{margin:6px 0;padding-left:20px}details.card li{margin:3px 0}
.tip{background:var(--bg);border-left:5px solid var(--sun);border-radius:6px;padding:8px 10px}
.demo{background:var(--bg);border:3px dashed var(--ink);border-radius:14px;padding:12px;margin-top:10px;text-align:center}
.at{display:flex;justify-content:space-between;align-items:center;max-width:300px;margin:0 auto;position:relative;transition:max-width .6s}
.ci{width:72px;height:72px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font:800 1.3rem 'Baloo 2',sans-serif;background:var(--pk);transition:background .6s}
.ci.c,.ci.h{background:var(--kl)}
.eb{position:absolute;left:78px;font-size:1.2rem;transition:left .8s}
.demo.on .eb{left:calc(100% - 100px)}.demo.on .n{background:#9ec5ff;color:#1d1647}.demo.on .c{background:#ffb0c0;color:#1d1647}
.demo:not(.on) .y,.demo.on .x{display:none}
.cv.on .at{max-width:150px}.cv .eb{left:50%;transform:translateX(-50%);opacity:0}.cv.on .eb{left:50%;opacity:1}
.cap{min-height:4.6em;margin:10px 0 6px;font-weight:700}
nav{overflow-x:auto}nav button{flex:1 0 auto;font-size:.85rem;white-space:nowrap;padding:10px 9px}
.gh{margin:18px 0 0;font-size:1.3rem}
.sp{display:inline-flex;align-items:center;gap:4px;margin:4px 2px;font-weight:800}.sp button{width:30px;height:30px;border:3px solid var(--ink);border-radius:8px;background:var(--card);font-weight:800}
select{padding:8px;border:3px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);font:700 1rem Nunito,sans-serif}
.ok2{color:var(--good);font-weight:800}.bad2{color:var(--bad);font-weight:800}
</style></head><body><main>
<header><h1>Hoá học vui 🧪</h1><p>Lớp 8 và lớp 9. Tự tay làm thí nghiệm ảo, không lo cháy nổ!</p></header>
<div class="card" id="acct" style="display:none;margin-top:0"></div><div class="card" id="asg" style="display:none"></div>
<nav role="tablist"><button role="tab" aria-selected="true" data-t="t0">Bài học</button><button role="tab" aria-selected="false" data-t="t4">Kỹ năng</button><button role="tab" aria-selected="false" data-t="t1">Nguyên tố</button><button role="tab" aria-selected="false" data-t="t2">Thí nghiệm</button><button role="tab" aria-selected="false" data-t="t3">Câu hỏi</button><button role="tab" aria-selected="false" data-t="t5">Kết quả</button></nav>

<section id="t0" class="on"><div id="les"></div></section>
<section id="t4"><div id="sk"></div></section>
<section id="t1"><div class="card info" id="info"></div>

<div class="legend"><span><i style="background:var(--kl)"></i>Kim loại</span><span><i style="background:var(--pk)"></i>Phi kim</span><span><i style="background:var(--kh)"></i>Khí hiếm</span></div></div></section>

<section id="t2"><div class="tg"></div>
<div class="card"><h3 id="lt"></h3><p class="hint">Chọn 2 chất rồi bấm Trộn. Có cặp phản ứng, có cặp thì không!</p><div class="chips" id="chips"></div><div class="act" id="act"></div></div>

<div class="row"><button class="btn" id="mix" disabled>Trộn</button><button class="btn alt" id="rst">Làm lại</button></div>
<div id="res"></div></div></section>

<section id="t5"><div class="card" id="rs"></div></section>
</main>

<script>
const $=s=>document.querySelector(s);

let M='v';const MN={v:'Hoá vô cơ',h:'Hoá hữu cơ'};

/* Nguyên tố */
const E=[[1,'H','Hiđro',1,'p','I','Nhẹ nhất, cháy tạo ra nước.'],[2,'He','Heli',4,'h','0','Bơm bóng bay bay lên được.'],[3,'Li','Liti',7,'k','I','Kim loại nhẹ nhất, có trong pin.'],[4,'Be','Beri',9,'k','II','Cứng, nhẹ, dùng trong hàng không.'],[5,'B','Bo',11,'p','III','Có trong thuỷ tinh chịu nhiệt.'],[6,'C','Cacbon',12,'p','IV','Có trong kim cương, than chì, mọi sinh vật.'],[7,'N','Nitơ',14,'p','III','Chiếm 78% thể tích không khí.'],[8,'O','Oxi',16,'p','II','Cần cho hô hấp và sự cháy.'],[9,'F','Flo',19,'p','I','Có trong kem đánh răng.'],[10,'Ne','Neon',20,'h','0','Sáng đỏ cam trong đèn quảng cáo.'],[11,'Na','Natri',23,'k','I','Mềm, phản ứng mạnh với nước.'],[12,'Mg','Magie',24,'k','II','Cháy sáng chói, dùng làm pháo hoa.'],[13,'Al','Nhôm',27,'k','III','Nhẹ, bền, làm vỏ lon nước ngọt.'],[14,'Si','Silic',28,'p','IV','Có trong cát, làm chip máy tính.'],[15,'P','Photpho',31,'p','V','Có trong xương và đầu que diêm.'],[16,'S','Lưu huỳnh',32,'p','II, IV, VI','Chất rắn vàng, làm axit sunfuric.'],[17,'Cl','Clo',35.5,'p','I','Khử trùng nước bể bơi.'],[18,'Ar','Agon',40,'h','0','Khí trơ, nạp trong bóng đèn.'],[19,'K','Kali',39,'k','I','Có trong chuối, cây trồng rất cần.'],[20,'Ca','Canxi',40,'k','II','Có trong xương, vỏ trứng, đá vôi.'],[26,'Fe','Sắt',56,'k','II, III','Làm gang thép, bị gỉ khi gặp ẩm.'],[29,'Cu','Đồng',64,'k','I, II','Dẫn điện tốt, làm dây điện.'],[30,'Zn','Kẽm',65,'k','II','Mạ sắt chống gỉ, điều chế H₂.'],[47,'Ag','Bạc',108,'k','I','Dẫn điện tốt nhất trong các kim loại.']];

$('#info').innerHTML=`<h2>${e[1]} – ${e[2]}</h2><dl><dt>Số hiệu</dt><dd>${e[0]}</dd><dt>Nguyên tử khối</dt><dd>${e[3]}</dd><dt>Loại</dt><dd>${TN[e[4]]}</dd><dt>Hoá trị</dt><dd>${e[5]}</dd></dl><p style="margin:0">${e[6]}</p>`}show(10);

/* Thí nghiệm */
const CH={v:['Na','Mg','Al','Zn','Fe','Cu','H2O','HCl','H2SO4','NaOH','CuSO4','AgNO3','CaCO3','Cl2','H2','O2','CO2','Ca(OH)2','CaO','CuO','BaCl2'],h:['CH4','C2H4','C2H2','C2H5OH','CH3COOH','O2','Br2','Na','CaCO3','NaOH','C6H6','Chất béo']};
/* m=nhóm, r=chất, fx=hiệu ứng, f=mặt cười */
const R=[
{m:'v',r:['Na','H2O'],eq:'2Na + 2H2O → 2NaOH + H2↑',t:'Khí thoát ra',fx:'gas',col:'#d9c6ff',f:'😲',o:'Na chạy tròn trên mặt nước, tan dần, có khí H2. Dung dịch làm quỳ tím hoá xanh.',n:'Natri rất hoạt động nên phản ứng ngay với nước.'},
{m:'v',r:['Mg','HCl'],eq:'Mg + 2HCl → MgCl2 + H2↑',t:'Khí thoát ra',fx:'gas',col:'#d2f1f7',f:'😃',o:'Mg tan dần, sủi bọt khí H2.',n:'Mg đứng trước H nên đẩy được H ra khỏi axit.'},
{m:'v',r:['Zn','HCl'],eq:'Zn + 2HCl → ZnCl2 + H2↑',t:'Khí thoát ra',fx:'gas',col:'#d2f1f7',f:'😃',o:'Viên Zn tan dần, bọt khí H2 nổi lên.',n:'Phản ứng này dùng điều chế H2 trong phòng thí nghiệm.'},

else{let x=rnd([.2,.3,.5,.6]),y=rnd([.1,.2,.4,.5]);if(x==y)y=.1;const du=x>y?'NaOH':'HCl';q=`Trộn ${fm(x)} mol NaOH với ${fm(y)} mol HCl. Chất nào dư và dư bao nhiêu mol?`;a=`1) PTHH: NaOH + HCl → NaCl + H2O, tỉ lệ 1 : 1<br>2) So sánh: ${fm(x)} mol NaOH và ${fm(y)} mol HCl. Chất có số mol nhỏ hơn phản ứng hết<br>3) Chất dư là <b>${du}</b>, dư ${fm(Math.abs(x-y))} mol`}

const LX=[

['v','⚡','Liên kết ion: cho và nhận',`<p>Nguyên tử luôn muốn có <b>8 e ở lớp ngoài cùng</b> (riêng H và He chỉ cần 2) giống khí hiếm cho bền. Đây là <b>quy tắc bát tử</b>.</p><p>Khi <b>kim loại gặp phi kim</b>, kim loại nhường e, phi kim nhận e. Hai ion trái dấu hút nhau như hai thanh nam châm. Đó là <b>liên kết ion</b>.</p><ul><li>Ví dụ: NaCl (muối ăn), MgO, CaCl2.</li><li>Chất ion thường là chất rắn, tan trong nước, nóng chảy ở nhiệt độ cao, dẫn điện khi tan hoặc nóng chảy.</li></ul><p class="tip">💡 Liên kết ion = kim loại + phi kim = "cho – nhận".</p>`,

['v','🍋','Axit, bazơ và muối',`<ul><li><b>Axit</b> (HCl, H2SO4): vị chua, làm quỳ tím hoá đỏ.</li><li><b>Bazơ</b> (NaOH, Ca(OH)2): nhờn, làm quỳ tím hoá xanh.</li><li><b>Muối</b> (NaCl, CuSO4): gồm kim loại kết hợp với gốc axit.</li></ul><p><b>Thang pH:</b> nhỏ hơn 7 là axit, bằng 7 là trung tính (nước tinh khiết), lớn hơn 7 là bazơ.</p><p><b>Trung hoà:</b> axit + bazơ → muối + nước.</p><p class="tip">💡 Chanh, giấm có tính axit. Xà phòng, nước vôi có tính bazơ. Đừng nếm hoá chất trong phòng thí nghiệm nhé!</p>`],

['v','🔩','Kim loại và phi kim',`<ul><li><b>Kim loại:</b> có ánh kim, dẻo, dẫn điện và dẫn nhiệt tốt (Fe, Cu, Al).</li><li><b>Phi kim:</b> thường giòn, không dẫn điện (S, C, Cl2, O2).</li></ul><p>Kim loại có thể tác dụng với: oxi, phi kim, dung dịch axit và dung dịch muối. Mức độ hoạt động theo <b>dãy hoạt động hoá học</b> (xem trong tab Thí nghiệm).</p><p><b>Gang</b> và <b>thép</b> là hợp kim của sắt với cacbon: gang chứa 2–5% C, thép chứa dưới 2% C.</p><p class="tip">💡 Sắt gỉ vì tác dụng với oxi và hơi nước. Sơn hoặc mạ kẽm giúp chống gỉ.</p>`],
['h','🌱','Hợp chất hữu cơ là gì?',`<p>Hợp chất hữu cơ là hợp chất của <b>cacbon</b> (trừ CO, CO2, muối cacbonat). Chúng có trong cơ thể người, thức ăn, nhiên liệu, quần áo.</p><ul><li>Hoá trị: C là IV, H là I, O là II.</li><li><b>Hiđrocacbon</b> chỉ có C và H (metan, etilen). <b>Dẫn xuất</b> có thêm O, N... (rượu, axit).</li><li>Đặc điểm: dễ cháy, thường có liên kết cộng hoá trị, thường ít tan trong nước.</li></ul><p class="tip">💡 Hữu cơ = có cacbon. Gặp CH4, C2H5OH, CH3COOH thì đó là hữu cơ.</p>`],
['h','🔥','Metan, etilen, axetilen',`<ul><li><b>Metan CH4</b>: chỉ có liên kết đơn. Cháy lửa xanh, có trong khí gas và biogas.</li><li><b>Etilen C2H4</b>: có 1 liên kết đôi C=C. Làm trái cây chín, cộng với brom, trùng hợp thành nhựa PE.</li><li><b>Axetilen C2H2</b>: có 1 liên kết ba C≡C. Cháy rất nóng, dùng hàn cắt kim loại.</li></ul><p class="tip">💡 Liên kết đôi và ba "kém bền", dễ mở ra để cộng thêm chất khác. Vì vậy etilen và axetilen làm mất màu dung dịch brom, còn metan thì không.</p>`],
['h','🍷','Rượu etylic và axit axetic',`<ul><li><b>Rượu etylic C2H5OH</b> có nhóm –OH. Cháy được, tác dụng với Na giải phóng H2, tan vô hạn trong nước.</li><li><b>Axit axetic CH3COOH</b> có nhóm –COOH. Giấm ăn chứa 2–5% axit axetic. Làm quỳ tím hoá đỏ, tác dụng với CaCO3, NaOH, kim loại.</li><li><b>Este hoá:</b> axit axetic + rượu etylic (H2SO4 đặc, t°) → este có mùi thơm + nước.</li></ul><p class="tip">💡 Nhóm chức quyết định tính chất: –OH là rượu, –COOH là axit.</p>`],
['h','🍚','Chất béo, đường, tinh bột, protein',`<ul><li><b>Chất béo</b> (dầu, mỡ): không tan trong nước, thuỷ phân tạo glixerol và axit béo.</li><li><b>Glucozơ C6H12O6</b>: đường trong quả nho chín, lên men thành rượu etylic.</li><li><b>Saccarozơ C12H22O11</b>: đường mía, đường củ cải.</li><li><b>Tinh bột và xenlulozơ</b>: tạo từ nhiều mắt xích glucozơ. Hồ tinh bột gặp iot hoá xanh tím.</li><li><b>Protein</b>: có trong thịt, trứng, sữa. Đun nóng bị đông tụ (lòng trắng trứng), cháy có mùi khét.</li></ul><p class="tip">💡 Ba nhóm dinh dưỡng chính: chất béo, chất bột đường và đạm (protein).</p>`],
['h','🧵','Polime: phân tử khổng lồ',`<p><b>Polime</b> là chất có phân tử rất lớn, gồm nhiều <b>mắt xích</b> giống nhau nối lại. Giống như chuỗi hạt gồm nhiều hạt nhỏ.</p><ul><li>PE (túi nilon, màng bọc thực phẩm) tạo từ etilen.</li><li>PVC (ống nước, áo mưa), tơ nilon, cao su.</li><li>Tinh bột, xenlulozơ, protein là polime thiên nhiên.</li></ul><p class="tip">💡 Nhựa rất bền nên khó phân huỷ. Hãy hạn chế túi nilon và phân loại rác nhé!</p>`]];
const N=[
['n','⚛️','Chất – Nguyên tử – Phân tử',`<ul><li><b>Vật thể</b> (cái cốc, cái bàn) được làm từ <b>chất</b> (thuỷ tinh, gỗ). Tính chất vật lí: màu, trạng thái, nhiệt độ sôi, khối lượng riêng. Tính chất hoá học: khả năng biến đổi thành chất khác.</li><li><b>Nguyên tử</b>: hạt nhân (proton mang +, neutron không mang điện) và electron (−) ở vỏ. Số proton = số electron.</li><li><b>Nguyên tố hoá học</b>: những nguyên tử cùng số proton. Kí hiệu: H, O, Na... <b>Nguyên tử khối</b> (NTK) tính bằng đvC: H = 1, C = 12, O = 16.</li><li><b>Phân tử</b>: nhóm nguyên tử liên kết với nhau. <b>Phân tử khối</b> (PTK) = tổng NTK. Ví dụ PTK của H2O = 2×1 + 16 = 18.</li></ul><p class="tip">💡 Phía dưới có thêm hai bài nhỏ về liên kết ion và liên kết cộng hoá trị, có hình minh hoạ.</p>`],
['n','🔢','Hoá trị – Công thức hoá học',`<p>Hoá trị là khả năng liên kết của nguyên tử: H (I), Na (I), Cl (I), O (II), Ca (II), Al (III), Fe (II hoặc III)...</p><p><b>Quy tắc hoá trị:</b> với hợp chất AxBy thì x × (hoá trị A) = y × (hoá trị B).</p><ul><li><b>Lập công thức:</b> Al (III) và O (II) → chéo hoá trị → Al2O3 (vì 2×3 = 3×2).</li><li><b>Tìm hoá trị:</b> Fe2O3 có 2 × a = 3 × 2 nên Fe có hoá trị III.</li><li><b>Ý nghĩa công thức:</b> cho biết chất gồm những nguyên tố nào, số nguyên tử mỗi nguyên tố và phân tử khối. Al2O3 có PTK = 2×27 + 3×16 = 102.</li></ul><p class="tip">💡 Thử công cụ "Viết công thức" ở tab Kỹ năng.</p>`],
['n','⚖️','Phương trình hoá học',`<p><b>Phản ứng hoá học</b> biến chất tham gia thành sản phẩm. Dấu hiệu: có khí, có kết tủa, đổi màu, toả nhiệt hoặc phát sáng.</p><p><b>Định luật bảo toàn khối lượng:</b> tổng khối lượng các chất tham gia bằng tổng khối lượng các sản phẩm.</p><ul><li>Bước 1: viết sơ đồ phản ứng (chất tham gia → sản phẩm).</li><li>Bước 2: cân bằng, sao cho số nguyên tử mỗi nguyên tố hai vế bằng nhau.</li><li>Bước 3: ghi điều kiện (t°, xúc tác).</li></ul><p><b>Ý nghĩa:</b> 2H2 + O2 → 2H2O cho biết tỉ lệ số phân tử (hay số mol) là 2 : 1 : 2.</p><p class="tip">💡 Chỉ được chỉnh hệ số đằng trước, không được sửa chỉ số nhỏ trong công thức. Luyện ở tab Kỹ năng.</p>`],
['n','🧮','Mol – Khối lượng – Thể tích khí',`<ul><li><b>Mol</b>: lượng chất chứa 6·10²³ hạt (số Avogadro).</li><li><b>Khối lượng mol M</b> (g/mol) có số trị bằng NTK hoặc PTK. M của H2O là 18 g/mol.</li><li>n = m / M, suy ra m = n × M.</li><li><b>Thể tích khí:</b> ở đktc V = n × 22,4 lít. Ở điều kiện chuẩn (25°C, 1 bar) V = n × 24,79 lít.</li><li><b>Tỉ khối:</b> d(A/B) = M của A / M của B. Với không khí, d(A/kk) = M của A / 29.</li><li><b>Nồng độ phần trăm</b> C% = (m chất tan / m dung dịch) × 100%. <b>Nồng độ mol</b> CM = n / V (mol/lít).</li></ul><p class="tip">💡 Mol là "cầu nối": đổi mọi dữ kiện về mol rồi mới tính tiếp.</p>`],
['v','🧱','Oxit',`<p>Oxit là hợp chất gồm 2 nguyên tố, trong đó có oxi.</p><ul><li><b>Oxit bazơ</b> (của kim loại): Na2O, CaO, CuO, Fe2O3.</li><li><b>Oxit axit</b> (của phi kim): CO2, SO2, SO3, P2O5.</li><li><b>Gọi tên:</b> tên nguyên tố + oxit, kèm hoá trị nếu có nhiều hoá trị (sắt (III) oxit). Với phi kim dùng tiền tố: lưu huỳnh đioxit SO2.</li></ul><p><b>Tính chất:</b> oxit bazơ + axit → muối + nước. Oxit axit + bazơ → muối + nước. Na2O, K2O, CaO, BaO + H2O → bazơ tan. Oxit axit + H2O → axit (trừ SiO2).</p><p><b>Điều chế:</b> đốt kim loại hoặc phi kim trong oxi; nhiệt phân bazơ không tan hoặc muối cacbonat (CaCO3 → CaO + CO2).</p><p class="tip">💡 Kim loại → oxit bazơ, phi kim → oxit axit.</p>`],
['v','💧','Axit',`<p>Axit gồm nguyên tử H liên kết với gốc axit. Ví dụ: HCl (clohiđric), H2SO4 (sunfuric), HNO3 (nitric), H3PO4 (photphoric), H2CO3 (cacbonic).</p><ul><li>Làm quỳ tím hoá đỏ.</li><li>+ kim loại đứng trước H → muối + H2 (Zn + 2HCl → ZnCl2 + H2↑).</li><li>+ bazơ → muối + nước.</li><li>+ oxit bazơ → muối + nước (CuO + 2HCl → CuCl2 + H2O).</li><li>+ muối → muối mới + axit mới (có kết tủa hoặc khí).</li></ul><p><b>H2SO4 đặc</b> hút nước mạnh, tác dụng cả với Cu, không giải phóng H2.</p><p class="tip">💡 An toàn: luôn rót từ từ axit vào nước, không rót nước vào axit.</p>`],
['v','🧼','Bazơ',`<p>Bazơ gồm kim loại liên kết với nhóm OH.</p><ul><li><b>Bazơ tan (kiềm):</b> NaOH, KOH, Ba(OH)2, Ca(OH)2 (ít tan). <b>Không tan:</b> Cu(OH)2, Fe(OH)3, Mg(OH)2.</li><li>Làm quỳ tím hoá xanh, phenolphtalein hoá hồng (chỉ với kiềm).</li><li>+ axit → muối + nước (phản ứng trung hoà).</li><li>+ oxit axit → muối + nước (CO2 + Ca(OH)2 → CaCO3↓ + H2O).</li><li>Kiềm + muối → muối mới + bazơ mới (có kết tủa).</li><li>Bazơ không tan bị nhiệt phân: Cu(OH)2 → CuO + H2O.</li></ul><p class="tip">💡 NaOH (xút) ăn da, dùng làm xà phòng. Ca(OH)2 là nước vôi trong.</p>`],
['v','🧂','Muối',`<p>Muối gồm kim loại (hoặc NH4) liên kết với gốc axit. Tên = tên kim loại (kèm hoá trị) + tên gốc axit: NaCl natri clorua, CuSO4 đồng (II) sunfat.</p><ul><li><b>Phân loại:</b> muối trung hoà (NaCl, Na2SO4) và muối axit (NaHCO3).</li><li>Muối + kim loại mạnh hơn → muối mới + kim loại mới.</li><li>Muối + axit, muối + kiềm, muối + muối → chất mới.</li><li><b>Phản ứng trao đổi</b> xảy ra khi tạo kết tủa, khí hoặc chất điện li yếu như nước.</li></ul><p><b>Bảng tính tan cần nhớ:</b> muối nitrat (NO3) tan hết; muối clorua tan trừ AgCl; muối sunfat tan trừ BaSO4 (CaSO4 ít tan); muối cacbonat và photphat không tan (trừ muối Na, K, NH4); muối Na và K đều tan.</p><p class="tip">💡 Kết tủa hay gặp: AgCl, BaSO4, CaCO3 (trắng), Cu(OH)2 (xanh lam), Fe(OH)3 (nâu đỏ).</p>`],
['v','🔩','Kim loại',`<ul><li><b>Vật lí:</b> ánh kim, dẻo, dẫn điện và dẫn nhiệt tốt.</li><li><b>Hoá học:</b> + O2 → oxit bazơ; + phi kim (Cl2, S) → muối; + axit → muối + H2; + dung dịch muối → muối mới + kim loại mới.</li><li><b>Dãy hoạt động:</b> K Na Mg Al Zn Fe Pb H Cu Hg Ag Pt Au (mạnh → yếu).</li><li><b>Điều chế:</b> điện phân nóng chảy (K, Na, Ca, Mg, Al); nhiệt luyện dùng CO, H2, C khử oxit (Zn, Fe, Cu); thuỷ luyện dùng kim loại mạnh đẩy kim loại yếu khỏi muối.</li><li><b>Ăn mòn:</b> kim loại bị phá huỷ do tác dụng của môi trường. <b>Bảo vệ:</b> sơn, mạ, bôi dầu mỡ, làm hợp kim (inox).</li></ul><p class="tip">💡 Kim loại đứng trước H đẩy H khỏi axit. Kim loại đứng trước đẩy kim loại đứng sau khỏi muối (trừ K, Na, Ca, Ba).</p>`],
['v','🧪','Phi kim',`<ul><li><b>Tính chất:</b> nhiều phi kim giòn, không dẫn điện (trừ than chì). Tác dụng với oxi tạo oxit axit, với H2, với kim loại.</li><li><b>Clo Cl2:</b> khí vàng lục, độc. + kim loại → muối clorua; + H2O → HCl + HClO (tẩy màu); + NaOH. Dùng khử trùng nước.</li><li><b>Cacbon:</b> kim cương, than chì, than vô định hình. Cháy tạo CO2, khử oxit kim loại (C + 2CuO → 2Cu + CO2).</li><li><b>CO</b>: khí độc, cháy được, có tính khử. <b>CO2</b>: không cháy, làm đục nước vôi trong, là oxit axit.</li><li><b>Silic:</b> làm chip, pin mặt trời; SiO2 là thành phần của cát và thuỷ tinh.</li></ul><p class="tip">💡 Chuỗi hay gặp: C → CO → CO2 → H2CO3 → muối cacbonat.</p>`],
['h','🛢️','Hiđrocacbon',`<p>Hợp chất hữu cơ là hợp chất của cacbon (trừ CO, CO2, muối cacbonat...). <b>Công thức phân tử</b> cho biết số nguyên tử, <b>công thức cấu tạo</b> cho biết cách liên kết.</p><ul><li><b>Metan CH4:</b> liên kết đơn.</li><li><b>Etilen C2H4:</b> 1 liên kết đôi.</li><li><b>Axetilen C2H2:</b> 1 liên kết ba.</li><li><b>Benzen C6H6:</b> vòng 6 cạnh, 3 liên kết đôi xen kẽ 3 liên kết đơn.</li></ul><ul><li><b>Cháy:</b> tạo CO2 và H2O.</li><li><b>Cộng</b> (etilen, axetilen): C2H4 + Br2 → C2H4Br2.</li><li><b>Thế</b> (metan, benzen): CH4 + Cl2 → CH3Cl + HCl (ánh sáng).</li><li><b>Trùng hợp:</b> nC2H4 → (–CH2–CH2–)n (nhựa PE).</li></ul><p class="tip">💡 Có liên kết đôi hoặc ba thì cộng được, chỉ có liên kết đơn thì thế.</p>`],
['h','🍶','Dẫn xuất của hiđrocacbon',`<p><b>Rượu etylic C2H5OH:</b> lỏng, tan vô hạn trong nước. <i>Độ rượu</i> là số ml rượu nguyên chất trong 100 ml hỗn hợp. Cháy toả nhiều nhiệt; + Na → H2↑.</p><p><b>Axit axetic CH3COOH:</b> là thành phần của giấm. Làm quỳ tím hoá đỏ; tác dụng với kim loại, bazơ, muối cacbonat (sủi bọt CO2).</p><p><b>Este – chất béo:</b> este hoá: CH3COOH + C2H5OH ⇌ CH3COOC2H5 + H2O (H2SO4 đặc, t°). Chất béo là este của glixerol và axit béo. Thuỷ phân trong kiềm (xà phòng hoá) thu được <b>xà phòng</b> và glixerol. Chất tẩy rửa gồm xà phòng và bột giặt.</p><p><b>Cacbohiđrat:</b> glucozơ (tráng bạc, lên men thành rượu); saccarozơ (thuỷ phân thành glucozơ và fructozơ); tinh bột (hồ tinh bột gặp iot hoá xanh tím); xenlulozơ (giấy, bông, vải).</p><p><b>Protein – polime:</b> protein (thịt, trứng, sữa) bị đông tụ khi đun nóng, cháy có mùi khét. Polime gồm chất dẻo (PE, PVC), tơ (nilon, tơ tằm) và cao su.</p><p class="tip">💡 –OH là rượu, –COOH là axit, este có mùi thơm trái cây.</p>`]];

function les(){const G={n:'🧱 Nền tảng',v:'🧪 Hoá học vô cơ',h:'🌿 Hoá học hữu cơ'};let h='<p class="hint">Chạm vào từng bài để mở. Mỗi bài có một mẹo nhớ 💡</p>',g='';
N.forEach((l,i)=>{if(l[0]!=g){g=l[0];h+=`<h2 class="gh">${G[g]}</h2>`}h+=`<details class="card"><summary><span>${l[1]}</span> ${i+1}. ${l[2]}</summary>${sub(l[3])}${l[4]||''}</details>`});$('#les').innerHTML=h}

const EL=[['Na',1],['K',1],['H',1],['Ag',1],['Ca',2],['Mg',2],['Zn',2],['Ba',2],['Cu',2],['Fe(II)',2,'Fe'],['Fe(III)',3,'Fe'],['Al',3],['O',2],['Cl',1],['S',2],['SO4',2,'SO4',1],['OH',1,'OH',1],['NO3',1,'NO3',1],['CO3',2,'CO3',1],['PO4',3,'PO4',1]].map(([l,v,y,g])=>({l,v,y:y||l,g}));
const gcd=(a,b)=>b?gcd(b,a%b):a;

const BE=['Fe + O2 → Fe3O4','Al + O2 → Al2O3','Al + HCl → AlCl3 + H2','CH4 + O2 → CO2 + H2O','Fe2O3 + H2 → Fe + H2O','C2H5OH + O2 → CO2 + H2O','Al + H2SO4 → Al2(SO4)3 + H2','NaOH + H2SO4 → Na2SO4 + H2O'];
let bi=0,cf=[];
function atoms(f){const t=f.match(/[A-Z][a-z]?|\d+|\(|\)/g),st=[{}];const add=(o,e,n)=>o[e]=(o[e]||0)+n;
for(let i=0;i<t.length;i++){const k=t[i],nx=/^\d+$/.test(t[i+1]||'')?+t[i+1]:0;
if(k=='(')st.push({});else if(k==')'){const o=st.pop();for(const e in o)add(st[st.length-1],e,o[e]*(nx||1));if(nx)i++}
else{add(st[st.length-1],k,nx||1);if(nx)i++}}return st[0]}
function bal(){const [l,r]=BE[bi].split(' → ').map(x=>x.split(' + '));const all=[...l,...r];if(cf.length!=all.length)cf=all.map(()=>1);
const sp=(f,i)=>`<span class="sp"><button onclick="cs(${i},-1)" aria-label="giảm">−</button><b>${cf[i]}</b><button onclick="cs(${i},1)" aria-label="tăng">+</button>${sub(f)}</span>`;
$('#bq').innerHTML=l.map((f,i)=>sp(f,i)).join(' + ')+' → '+r.map((f,i)=>sp(f,i+l.length)).join(' + ')}
function cs(i,d){cf[i]=Math.max(1,Math.min(9,cf[i]+d));bal();$('#bm').textContent=''}
function bnext(){bi=(bi+1)%BE.length;cf=[];bal();$('#bm').textContent=''}
function bchk(){const [l,r]=BE[bi].split(' → ').map(x=>x.split(' + '));const T=(arr,off)=>{const o={};arr.forEach((f,i)=>{const a=atoms(f);for(const e in a)o[e]=(o[e]||0)+a[e]*cf[i+off]});return o};
const L1=T(l,0),R1=T(r,l.length);for(const e of new Set([...Object.keys(L1),...Object.keys(R1)]))if((L1[e]||0)!=(R1[e]||0)){$('#bm').innerHTML=`<span class="bad2">Chưa cân bằng:</span> nguyên tố ${e} có ${L1[e]||0} nguyên tử bên trái, ${R1[e]||0} bên phải.`;return}
const g=cf.reduce(gcd);$('#bm').innerHTML=g>1?'<span class="ok2">Đã cân bằng, nhưng có thể rút gọn hệ số nhỏ hơn.</span>':'<span class="ok2">Chính xác! Đã cân bằng 🎉</span>';if(g==1)spawn('⭐',6)}
function mc(){const m=+$('#c1').value,M=+$('#c2').value;if(!m||!M){$('#mr').textContent='';return}const n=m/M,f=x=>(+x.toFixed(3)).toString().replace('.',',');
$('#mr').innerHTML=`<p>n = ${f(m)} / ${f(M)} = <b>${f(n)} mol</b><br>Nếu là chất khí: V(đktc) = <b>${f(n*22.4)} lít</b>; V(25°C, 1 bar) = <b>${f(n*24.79)} lít</b></p>`}

<details class="card" open><summary><span>✍️</span> A. Viết công thức hoá học</summary><p>Chọn hai chất (một kim loại hoặc H, một gốc như O, Cl, SO4...) để lập công thức theo quy tắc chéo hoá trị.</p><div class="row"><select id="sa" onchange="fa()">${opt(11)}</select><select id="sb" onchange="fa()">${opt(12)}</select></div><div id="fo"></div></details>
<details class="card"><summary><span>⚖️</span> B. Cân bằng phương trình</summary><p>Bấm − và + để chỉnh hệ số, rồi bấm Kiểm tra.</p><div id="bq"></div><div class="row"><button class="btn" onclick="bchk()">Kiểm tra</button><button class="btn alt" onclick="bnext()">Phương trình khác</button></div><p id="bm"></p></details>
<details class="card"><summary><span>🧮</span> C. Tính theo phương trình hoá học</summary><p><b>Quy trình:</b> đổi dữ kiện ra mol → viết PTHH → so tỉ lệ mol → tính đại lượng cần tìm.</p><p><b>Ví dụ:</b> cho 5,6 g Fe tác dụng với HCl dư. Tính V khí H2 (đktc).<br>n(Fe) = 5,6 / 56 = 0,1 mol. Fe + 2HCl → FeCl2 + H2, tỉ lệ 1 : 1 nên n(H2) = 0,1 mol. V = 0,1 × 22,4 = <b>2,24 lít</b>.</p><p>Máy đổi nhanh sang mol:</p><input id="c1" type="number" step="any" placeholder="Khối lượng m (g)" oninput="mc()"><input id="c2" type="number" step="any" placeholder="Khối lượng mol M (g/mol)" oninput="mc()" style="margin-top:6px"><div id="mr"></div><div class="row"><button class="btn" onclick="prob()">🎲 Cho mình một bài</button></div><div id="pb"></div></details>
<details class="card"><summary><span>🔍</span> D. Nhận biết chất</summary><ul><li>Axit: quỳ tím hoá đỏ. Bazơ tan: quỳ tím hoá xanh, phenolphtalein hồng.</li><li>CO2: làm đục nước vôi trong. H2: cháy nổ nhẹ. O2: làm que đóm còn tàn đỏ bùng cháy.</li><li>Gốc clorua: AgNO3 → AgCl trắng. Gốc sunfat: BaCl2 → BaSO4 trắng.</li><li>Cu²⁺: NaOH → kết tủa xanh lam. Fe³⁺: NaOH → kết tủa nâu đỏ.</li><li>Etilen, axetilen: làm mất màu dung dịch brom. Tinh bột: iot → xanh tím. Glucozơ: tráng bạc.</li><li>Axit axetic: quỳ tím hoá đỏ, sủi bọt với CaCO3. Rượu etylic: sủi bọt khí với Na.</li></ul><p class="tip">💡 Dựa vào màu, trạng thái, kết tủa, khí hoặc quỳ tím. Chọn thuốc thử cho mỗi chất cho ra hiện tượng khác nhau.</p></details>
<details class="card"><summary><span>🧩</span> E. Chuỗi phản ứng</summary><p>Xác định loại chất từng mắt xích rồi chọn phản ứng phù hợp. Thử tự viết trước khi mở đáp án.</p><details><summary><b>Cu → CuO → CuSO4 → Cu(OH)2 → CuO</b></summary><p>${sub('(1) 2Cu + O2 → 2CuO (t°)<br>(2) CuO + H2SO4 → CuSO4 + H2O<br>(3) CuSO4 + 2NaOH → Cu(OH)2↓ + Na2SO4<br>(4) Cu(OH)2 → CuO + H2O (t°)')}</p></details><details><summary><b>C → CO2 → CaCO3 → CO2</b></summary><p>${sub('(1) C + O2 → CO2 (t°)<br>(2) CO2 + Ca(OH)2 → CaCO3↓ + H2O<br>(3) CaCO3 + 2HCl → CaCl2 + H2O + CO2↑')}</p></details><details><summary><b>C2H4 → C2H5OH → CH3COOH → CH3COOC2H5</b></summary><p>${sub('(1) C2H4 + H2O → C2H5OH (axit, t°)<br>(2) C2H5OH + O2 → CH3COOH + H2O (men giấm)<br>(3) CH3COOH + C2H5OH ⇌ CH3COOC2H5 + H2O (H2SO4 đặc, t°)')}</p></details></details>`;fa();bal()}
